  <style>

    body{margin:0;font-family:"Noto Sans Thai","DM Sans",sans-serif;color:var(--ink)}
    .app-wrapper{width:100%}
    .paper{width:min(100%,1060px);margin-inline:auto}

    .option.incorrect{border-color:var(--pink);background:var(--pale)}
    .option-letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid #aebcc9;color:var(--navy);font:700 13px "DM Sans",sans-serif}

      ["คนรู้จักขอดูข้อมูลของบุคคลอื่นในระบบเพราะเป็นห่วง ควรทำอย่างไร","ปฏิเสธเพราะไม่มีเหตุจำเป็นตามหน้าที่","เปิดดูแล้วบอกคร่าว ๆ","ส่งภาพหน้าจอ","ขอให้เพื่อนเปิดแทน","A","เข้าถึงข้อมูลเฉพาะเมื่อจำเป็นต่อหน้าที่"]
    ]
  }
];

const answers=parts.map(part=>Array(part.rows.length).fill(null));
let activePart=0,graded=false;
const tabs=[...document.querySelectorAll(".part-tab")];
const questionHost=document.getElementById("questions");
const make=(tag,classes,text)=>{
  const node=document.createElement(tag);
  if(classes)node.className=classes;
  if(text!==undefined)node.textContent=text;
  return node;
};
function updateProgress(){
  let total=0;
  answers.forEach((part,i)=>{
    const count=part.filter(Boolean).length;
    total+=count;
    tabs[i].querySelector(".tab-count").textContent=`ตอบแล้ว ${count} / ${part.length}`;
  });
  document.getElementById("overall-progress").textContent=`ตอบแล้ว ${total} / 130 ข้อ`;
  document.getElementById("active-part-progress").textContent=`ตอบแล้ว ${answers[activePart].filter(Boolean).length} / ${answers[activePart].length}`;
}
function renderPart(){
  tabs.forEach((tab,i)=>{
    tab.setAttribute("aria-selected",String(i===activePart));
    tab.tabIndex=i===activePart?0:-1;
  });
  document.getElementById("active-part-title").textContent=parts[activePart].name;
  const fragment=document.createDocumentFragment();
  const part=parts[activePart];
  part.rows.forEach((row,index)=>{
    const number=index+1;
    const section=part.sections.find(item=>item[0]===number);
    if(section)fragment.append(make("h4","rounded-lg bg-[#203b60] text-white font-bold px-5 py-3 mt-8 mb-5",section[1]));
    if(part.contexts && part.contexts[number]){
      const passage=make("aside","rounded-xl border-l-4 border-[#df627e] bg-[#fbedf1] p-5 sm:p-7 leading-relaxed");
      passage.append(make("p","text-sm font-bold text-[#203b60] mb-2",`อ่านข้อมูลสำหรับข้อ ${number} เป็นต้นไป`),make("p","",part.contexts[number]));
      fragment.append(passage);
    }
    const card=make("article","question-card rounded-2xl border border-slate-200 bg-white shadow-sm p-5 sm:p-7");
    card.id=`question-${activePart+1}-${number}`;
    const head=make("div","flex items-start gap-3 mb-5");
    head.append(make("span","shrink-0 rounded-md bg-[#fbedf1] px-2.5 py-1 font-bold text-[#bd4967]",String(number)),make("h5","font-semibold text-[#203b60] leading-relaxed",row[0]));
    card.append(head);
    const choices=make("div","grid gap-2");
    row.slice(1,5).forEach((text,optionIndex)=>{
      const letter="ABCD"[optionIndex];
      const button=make("button","option");
      button.type="button";
      button.setAttribute("aria-label",`Part ${activePart+1} ข้อ ${number} ตัวเลือก ${letter}: ${text}`);
      button.setAttribute("aria-pressed",String(answers[activePart][index]===letter));
      button.disabled=graded;
      button.append(make("span","option-letter",letter),make("span","flex-1",text));
      if(graded){
        if(letter===row[5])button.classList.add("correct");
        else if(answers[activePart][index]===letter)button.classList.add("incorrect");
      }
      button.addEventListener("click",()=>{
        answers[activePart][index]=letter;
        choices.querySelectorAll("button").forEach(choice=>choice.setAttribute("aria-pressed",String(choice===button)));
        updateProgress();
      });
      choices.append(button);
    });
    card.append(choices);
    if(graded){
      const review=make("div","mt-5 rounded-xl border border-slate-200 bg-slate-50 p-4 leading-relaxed");
      review.append(
        make("p","font-bold text-[#203b60]",`คำตอบของคุณ: ${answers[activePart][index]||"ไม่ได้ตอบ"} · เฉลย: ${row[5]}`),
        make("p","mt-1 text-sm sm:text-base",row[6])
      );
      card.append(review);
    }
    fragment.append(card);
  });
  questionHost.replaceChildren(fragment);
  updateProgress();
}
tabs.forEach((tab,i)=>{
  tab.addEventListener("click",()=>{
    activePart=i;
    renderPart();
    document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"});
  });
  tab.addEventListener("keydown",event=>{
    if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
    event.preventDefault();
    const next=(i+(event.key==="ArrowRight"?1:2))%3;
    tabs[next].click();
    tabs[next].focus();
  });
});
document.getElementById("grade-button").addEventListener("click",()=>{
  graded=true;
  let total=0;
  const scores=document.getElementById("part-scores");
  scores.replaceChildren();
  parts.forEach((part,i)=>{
    const score=answers[i].reduce((sum,answer,j)=>sum+(answer===part.rows[j][5]?1:0),0);
    total+=score;
    const line=make("div","flex flex-wrap justify-between gap-3 px-5 sm:px-7 py-4");
    line.append(make("span","",part.name),make("strong","text-[#203b60]",`${score} / ${part.rows.length}`));
    scores.append(line);
  });
  document.getElementById("total-score").textContent=`${total} / 130`;
  document.getElementById("results").classList.remove("hidden");
  renderPart();
  document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("edit-button").addEventListener("click",()=>{
  graded=false;
  document.getElementById("results").classList.add("hidden");
  renderPart();
  document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("reset-button").addEventListener("click",()=>{
  document.getElementById("reset-confirmation").classList.remove("hidden");
  document.getElementById("confirm-reset").focus();
});
document.getElementById("cancel-reset").addEventListener("click",()=>{
  document.getElementById("reset-confirmation").classList.add("hidden");
  document.getElementById("reset-button").focus();
});
document.getElementById("confirm-reset").addEventListener("click",()=>{
  answers.forEach(part=>part.fill(null));
  activePart=0;
  graded=false;
  document.getElementById("results").classList.add("hidden");
  document.getElementById("reset-confirmation").classList.add("hidden");
  renderPart();
  document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"});
});
renderPart();
</script>
 </body>
</html>
