  "1-1": `Why Cramming Feels Effective
Many students prepare for their examinations by reviewing their notes intensively during the final few days. This approach, often called cramming, can feel highly productive at the time. After a chapter has been reread several times, the material looks familiar, and that sense of familiarity is easily mistaken for understanding. Yet research on memory suggests that information learned in this way tends to fade quickly once the examination is over.
An alternative is to spread study sessions over a longer period and to test oneself rather than simply reread. When learners try to recall information without looking at their notes, they have to reconstruct it, and this effort appears to strengthen memory. Spacing sessions apart has a similar effect: returning to a topic after some forgetting has occurred makes the next review harder, but what is learned tends to last longer.
Interestingly, students who use these methods often report feeling less confident while studying. Testing oneself exposes gaps that rereading conceals, so progress can seem slower. This may explain why many learners abandon effective strategies in favor of comfortable ones. The lesson is not that studying should be unpleasant, but that the ease of a method is a poor guide to its value.`,
  "1-4": `Heat Waves and Older Adults
As summers grow hotter in many cities, local authorities are paying closer attention to the health risks of extreme heat. Older adults are particularly vulnerable. With age, the body becomes less efficient at controlling its temperature, and some common medications can weaken the sense of thirst. As a result, an older person may become dangerously dehydrated without feeling especially uncomfortable.
Physical factors, however, tell only part of the story. Studies of past heat waves have found that people who lived alone and had little contact with neighbors were at considerably greater risk than people with similar health conditions who were visited regularly. Isolated individuals may not recognize the warning signs in themselves, and there may be no one nearby to notice those signs either.
For this reason, several cities have combined practical measures with social ones. Air-conditioned public buildings such as libraries are opened as cooling centers during hot spells, but officials have learned that simply opening the doors is not enough, because many of the people most at risk never arrive. Some programs therefore recruit volunteers to telephone or visit registered older residents during heat alerts, checking whether they are drinking enough and whether they need help getting to a cooler place.`,
  "1-7": `What Remote Work Can Miss
When offices closed suddenly in 2020, many organizations discovered that a large share of their work could be done from home. Meetings moved online, documents were shared digitally, and productivity in many roles held steady or even improved. For experienced employees with clearly defined tasks, the change often brought welcome benefits, including fewer interruptions and no daily commute.
The picture is less straightforward for newcomers. Much of what junior staff learn at work is never formally taught. They pick it up by overhearing how a colleague handles a difficult phone call, by asking a quick question across a desk, or by watching how decisions are actually made. Researchers sometimes call this informal learning, and it depends heavily on being physically close to others. When everyone works remotely, these small opportunities largely disappear, and newer employees may hesitate to schedule a video call for a question that seems minor.
None of this means that remote work should be abandoned. Rather, it suggests that organizations need to replace deliberately what used to happen by accident. Some teams now hold open online sessions where anyone can drop in with questions; others pair each new employee with a mentor who checks in regularly. Such measures cannot fully reproduce the office, but they can reduce the disadvantage for those who have the most to learn.`,
  "1-10": `Plain Language in Public Services
Government forms and official letters have long had a reputation for being difficult to read. Long sentences, technical terms, and impersonal phrases such as “it has been determined that” can leave readers unsure what they are being asked to do. For people with limited reading skills, or for those reading in a second language, the effect can be more serious than mild frustration. They may miss deadlines, fail to claim benefits to which they are entitled, or make repeated visits to an office to ask for explanations.
In response, a number of public agencies have adopted plain-language policies. Writers are encouraged to use everyday words, address the reader directly as “you,” and place the most important information first. Critics initially argued that simplified documents would lose legal precision. In practice, however, agencies that tested revised letters often found the opposite: when instructions were clearer, fewer people made errors in completing forms, and staff spent less time answering telephone queries.
Plain language is not the same as simplistic language. A well-written letter may still deal with complex matters; the goal is to remove unnecessary difficulty rather than to remove content. Some agencies now test drafts with members of the public before sending them out, treating comprehension as something to be checked rather than assumed.`,
  "1-13": `Prescribing Connection
In some health systems, doctors can now refer patients not only to specialists or for medication but also to community activities such as walking groups, art classes, or gardening projects. This approach, known as social prescribing, is based on the recognition that many visits to a doctor are linked to problems that medicine alone cannot solve, including loneliness, money worries, and a lack of purpose.
A typical scheme works through a link worker, who meets the patient, discusses what matters to them, and helps them find suitable local activities. The link worker's role is significant. Simply handing someone a leaflet about a community choir is unlikely to change much if that person feels anxious about walking into a room full of strangers. Support with the first step is often what makes the difference.
Evidence on the effectiveness of social prescribing is still developing. Participants frequently report feeling more confident and less isolated, and some studies have found reductions in visits to doctors. However, many evaluations have been small or have lacked comparison groups, which makes it difficult to know whether the improvements were caused by the scheme itself. Supporters argue that the approach deserves continued investment; more cautious observers agree, but stress the need for more rigorous research before it is expanded widely.`,
  "1-16": `When Targets Change Behavior
Public services are often managed through numerical targets. A hospital might be expected to see emergency patients within four hours; a city office might aim to answer all letters within ten working days. Targets of this kind have clear advantages. They make performance visible, allow comparisons between organizations, and can draw attention to problems that had previously been ignored.
Yet targets can also produce unintended consequences. When an organization is judged mainly on a single figure, staff may concentrate on improving that figure rather than the service it was meant to represent. A call center measured on how quickly it ends calls, for example, may meet its target while callers are left with unresolved problems and have to call back. In such cases, the number improves but the experience of the public does not.
The difficulty is not that measurement is useless, but that any single measure captures only part of what matters. For this reason, some managers now use a small set of indicators that balance one another, such as combining speed with measures of whether problems were actually solved. Others add regular conversations with service users, on the grounds that some aspects of quality are hard to count but easy to recognize when people describe them.`,
  "1-49": `Many office workers spend most of the day seated in front of a screen. Although this may seem harmless, long periods without movement have been linked to back pain, eye strain, and reduced concentration. (49) ______, health advisers increasingly recommend short breaks at regular intervals.
These breaks do not need to be long. Standing up, stretching, or looking at a distant object for a minute or two can be (50) ______ effective in reducing discomfort. Some workers set reminders on their phones, (51) ______ others link their breaks to routine tasks, such as walking to a colleague's desk instead of sending a message.`,
  "1-52": `Many universities now run peer tutoring programs, in which experienced students help others with difficult courses. The tutors are not expected to replace lecturers. (52) ______, they offer a kind of support that formal teaching sometimes cannot: they remember what it was like to struggle with the same material.
Research suggests that tutors benefit as well. Explaining a concept to someone else requires tutors to organize their own knowledge, (53) ______ often reveals gaps they had not noticed. For students who receive help, the relaxed atmosphere can make it easier to ask questions they might feel (54) ______ to raise in a large lecture hall.`,
  "1-55": `Email — Course Withdrawal Deadline
Dear Students,
This is a reminder that the last day to withdraw from a course without academic penalty is Friday, March 14. Withdrawals submitted by this date will appear as “W” on your transcript and will not affect your grade point average.
After March 14, withdrawal will be possible only in exceptional circumstances, such as serious illness, and must be supported by documents. Late requests should be submitted to your faculty office rather than through the online portal.
Please note that withdrawing from a course may affect scholarship eligibility. Students receiving financial support are strongly advised to consult the Scholarships Office before making a decision.
Kind regards, Office of the Registrar`,
  "1-57": `Public Notice — FREE SEASONAL FLU VACCINATION
The District Health Office will offer free flu vaccinations at Riverside Community Hall from November 3 to November 21, Monday to Friday, 9:00 a.m.–3:00 p.m.
Eligible groups: Adults aged 65 and over; pregnant women; people with long-term heart or lung conditions; children aged 6 months to 2 years.
Other residents may add their names to a waiting list at the hall and will be contacted if vaccines remain after November 21. Please bring an ID card. Appointments are not required.`,
  "1-59": `Report Summary — Staff Wellbeing Survey
In June, 240 of the 300 employees at the city's three service centers completed an anonymous wellbeing survey.
Key findings: 72% were satisfied with their working relationships; 58% felt tired at the end of most working days; only 31% knew how to access the staff counseling service; staff at the North Center reported the highest workload.
Recommendation: Before any new program is introduced, the committee recommends a campaign to inform staff about the counseling service. A follow-up survey will be conducted in December.`,

const sections=[
 [[1,"Reading Comprehension"],[19,"Vocabulary in Context"],[29,"Grammar in Context"],[39,"Communication"],[49,"Cloze / Integrated Language"],[55,"Academic & Professional Interpretation"]],
 [[1,"การระบุประเด็นสำคัญและข้อมูลที่เกี่ยวข้อง"],[6,"การอนุมานและการสรุปผล"],[12,"ตรรกะ เงื่อนไข และความสัมพันธ์"],[20,"การประเมินข้อโต้แย้งและหลักฐาน"],[25,"การแปลผลข้อมูล"],[31,"การแก้ปัญหาและการตัดสินใจ"],[38,"ความน่าเชื่อถือของข้อมูลและอคติ"]],
 [[1,"การแก้ปัญหาและการคิดอย่างมีวิจารณญาณ"],[6,"การสื่อสารและการทำงานร่วมกัน"],[11,"การปรับตัวและการจัดการการเปลี่ยนแปลง"],[15,"ความฉลาดรู้ด้านดิจิทัล ข้อมูล และ AI"],[20,"การเรียนรู้ตลอดชีวิต"],[23,"ภาวะผู้นำและการบริหารงาน"],[27,"จริยธรรมและความรับผิดชอบ"]]
];
const parts=[
 {name:"PART 1 · English Competency",rows:english},
 {name:"PART 2 · Analytical & Logical Reasoning",rows:analytical},
 {name:"PART 3 · Future Work Competencies",rows:future}
];
const answers=parts.map(p=>Array(p.rows.length).fill(null));
let activePart=0,graded=false;
const tabs=[...document.querySelectorAll(".part-tab")];
const questionHost=document.getElementById("questions");
function el(tag,classes,text){
 const node=document.createElement(tag);
 if(classes)node.className=classes;
 if(text!==undefined)node.textContent=text;
 return node;
}
function updateProgress(){
 let total=0;
 answers.forEach((a,i)=>{
  const count=a.filter(Boolean).length;total+=count;
  tabs[i].querySelector(".tab-count").textContent=`ตอบแล้ว ${count} / ${a.length}`;
 });
 document.getElementById("overall-progress").textContent=`ตอบแล้ว ${total} / 130 ข้อ`;
 document.getElementById("active-part-progress").textContent=`ตอบแล้ว ${answers[activePart].filter(Boolean).length} / ${answers[activePart].length}`;
}
function addPassage(text,fragment){
 const box=el("aside","rounded-xl border-l-4 border-[#df627e] bg-[#fbedf1] p-5 sm:p-7 mb-6");
 const lines=text.split("\n");
 const title=el("h4","font-bold text-[#203b60] mb-3",lines.shift());
 const body=el("div","passage text-[15px] sm:text-base",lines.join("\n"));
 box.append(title,body);fragment.append(box);
}
function renderPart(){
 tabs.forEach((tab,i)=>{tab.setAttribute("aria-selected",String(i===activePart));tab.tabIndex=i===activePart?0:-1});
 document.getElementById("active-part-title").textContent=parts[activePart].name;
 const fragment=document.createDocumentFragment();
 parts[activePart].rows.forEach((raw,index)=>{
  const number=index+1;
  const passage=passages[`${activePart+1}-${number}`];
  if(passage)addPassage(passage,fragment);
  const section=sections[activePart].find(([start])=>start===number);
  if(section)fragment.append(el("h4","rounded-lg bg-[#203b60] text-white font-bold px-5 py-3 mt-8 mb-5",section[1]));
  const [prompt,...options]=raw.split("|");
  const card=el("article","question-card rounded-2xl border border-slate-200 bg-white shadow-sm p-5 sm:p-7");
  card.id=`question-${activePart+1}-${number}`;
  const head=el("div","flex items-start gap-3 mb-5");
  head.append(el("span","shrink-0 rounded-md bg-[#fbedf1] px-2.5 py-1 font-bold text-[#bd4967]",String(number)));
  head.append(el("h5","question-copy font-semibold text-[#203b60] leading-relaxed",prompt));
  card.append(head);
  const choices=el("div","grid gap-2");
  options.forEach((text,optionIndex)=>{
   const letter="ABCD"[optionIndex];
   const button=el("button","option");
   button.type="button";
   button.setAttribute("aria-label",`Part ${activePart+1} ข้อ ${number} ตัวเลือก ${letter}: ${text}`);
   button.setAttribute("aria-pressed",String(answers[activePart][index]===letter));
   button.disabled=graded;
   button.append(el("span","option-letter",letter),el("span","flex-1",text));
   if(graded){
    if(letter===answerKeys[activePart][index])button.classList.add("correct");
    else if(answers[activePart][index]===letter)button.classList.add("incorrect");
   }
   button.addEventListener("click",()=>{
    answers[activePart][index]=letter;
    choices.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
    updateProgress();
   });
   choices.append(button);
  });
  card.append(choices);
  if(graded){
   const correct=answerKeys[activePart][index];
   const selected=answers[activePart][index];
   const review=el("div","mt-5 rounded-xl border border-slate-200 bg-slate-50 p-4 leading-relaxed");
   review.append(el("p","font-bold text-[#203b60]",`คำตอบของคุณ: ${selected||"ไม่ได้ตอบ"} · เฉลย: ${correct}`));
   review.append(el("p","mt-1 text-sm sm:text-base",reasons[activePart][index]));
   card.append(review);
  }
  fragment.append(card);
 });
 questionHost.replaceChildren(fragment);
 updateProgress();
}
tabs.forEach((tab,i)=>{
 tab.addEventListener("click",()=>{activePart=i;renderPart();document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"})});
 tab.addEventListener("keydown",event=>{
  if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
  event.preventDefault();
  const next=(i+(event.key==="ArrowRight"?1:2))%3;
  tabs[next].click();tabs[next].focus();
 });
});
document.getElementById("grade-button").addEventListener("click",()=>{
 graded=true;
 let total=0;
 const scores=document.getElementById("part-scores");
 scores.replaceChildren();
 parts.forEach((part,i)=>{
  const score=answers[i].reduce((sum,answer,j)=>sum+(answer===answerKeys[i][j]?1:0),0);
  total+=score;
  const row=el("div","flex flex-wrap justify-between gap-3 px-5 sm:px-7 py-4");
  row.append(el("span","",part.name),el("strong","text-[#203b60]",`${score} / ${part.rows.length}`));
  scores.append(row);
 });
 document.getElementById("total-score").textContent=`${total} / 130`;
 document.getElementById("results").classList.remove("hidden");
 renderPart();
 document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("edit-button").addEventListener("click",()=>{
 graded=false;document.getElementById("results").classList.add("hidden");renderPart();
 document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("reset-button").addEventListener("click",()=>{
 document.getElementById("reset-confirmation").classList.remove("hidden");
 document.getElementById("confirm-reset").focus();
});
document.getElementById("cancel-reset").addEventListener("click",()=>{
 document.getElementById("reset-confirmation").classList.add("hidden");
 document.getElementById("reset-button").focus();
});
document.getElementById("confirm-reset").addEventListener("click",()=>{
 answers.forEach(part=>part.fill(null));activePart=0;graded=false;
 document.getElementById("results").classList.add("hidden");
 document.getElementById("reset-confirmation").classList.add("hidden");
 renderPart();document.getElementById("question-panel").scrollIntoView({behavior:"smooth",block:"start"});
});
renderPart();
</script>
 </body>
</html>
